<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" fill="none" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Jihun Kim</title>
  <desc id="desc">Jihun Kim — Senior R&amp;D Engineer · Team Lead @ SkyAutoNet. Embedded Systems · Autonomous Driving · Seoul, Korea</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .name { font-size: 60px; font-weight: 800; letter-spacing: -1px; }
    .role { font-size: 20px; font-weight: 500; fill: #a9b1d6; }
    .tag  { font-size: 13.5px; font-weight: 600; fill: #c0caf5; }
    .up { animation: up 0.8s ease-out backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { .up { animation: none; } }
  </style>
  <defs>
