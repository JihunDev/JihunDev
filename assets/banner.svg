      <stop offset="0" stop-color="#7aa2f7"/><stop offset=".5" stop-color="#bb9af7"/><stop offset="1" stop-color="#73daca"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="#1a1b27"/>
    <rect y="216" width="1000" height="4" fill="url(#accent)"/>
    <g class="up" style="animation-delay:.1s"><text x="500" y="100" text-anchor="middle" class="name" fill="url(#name-fill)">Jihun Kim</text></g>
    <g class="up" style="animation-delay:.25s"><text x="500" y="140" text-anchor="middle" class="role">Senior R&amp;D Engineer · Team Lead @ SkyAutoNet</text></g>
    <g class="up" style="animation-delay:.4s"><g transform="translate(239.7 164)"><rect width="182.2" height="30" rx="15" fill="#1f2335" stroke="#3b4261"/><circle cx="18" cy="15" r="4" fill="#7aa2f7"/><text x="30" y="20" class="tag">Embedded Systems</text></g><g transform="translate(432.0 164)"><rect width="186.0" height="30" rx="15" fill="#1f2335" stroke="#3b4261"/><circle cx="18" cy="15" r="4" fill="#bb9af7"/><text x="30" y="20" class="tag">Autonomous Driving</text></g><g transform="translate(628.0 164)"><rect width="132.3" height="30" rx="15" fill="#1f2335" stroke="#3b4261"/><circle cx="18" cy="15" r="4" fill="#73daca"/><text x="30" y="20" class="tag">Seoul, Korea</text></g></g>
