<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Jihun Kim</title>
  <desc id="desc">Jihun Kim — Senior R&amp;D Engineer · Team Lead @ SkyAutoNet. Embedded Systems · Autonomous Driving · Seoul, Korea</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .kicker { font-size: 15px; font-weight: 600; letter-spacing: 2px; fill: #7aa2f7; }
    .name { font-size: 64px; font-weight: 800; letter-spacing: -1px; }
    .role { font-size: 20px; font-weight: 500; fill: #a9b1d6; }
    .pill { font-family: system-ui, -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; font-size: 13.5px; font-weight: 600; fill: #c0caf5; }
    .chip-label { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #7aa2f7; }
    .pulse path { stroke-dasharray: 16 var(--len); stroke-dashoffset: calc(var(--len) + 16);
                  animation: flow 2.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
    .up { animation: up 0.9s ease-out backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } }
    .glow { animation: glow 3s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } .up, .glow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15161e"/><stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <radialGradient id="g-blue"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".32"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-purple"><stop offset="0" stop-color="#bb9af7" stop-opacity=".26"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-teal"><stop offset="0" stop-color="#73daca" stop-opacity=".12"/><stop offset="1" stop-color="#73daca" stop-opacity="0"/></radialGradient>
    <linearGradient id="name-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#c0caf5"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#414868"/>
    </pattern>
    <linearGradient id="fade-left" x1="0" x2="1">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="right-only"><rect width="1000" height="280" fill="url(#fade-left)"/></mask>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

